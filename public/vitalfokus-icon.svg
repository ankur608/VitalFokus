<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vfGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#008f7e" />
    </linearGradient>
    <filter id="vfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#008f7e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="12" y="12" width="176" height="176" rx="46" ry="46" fill="url(#vfGradient)" filter="url(#vfGlow)" />

  <!-- Subtle Blueprint Circle & Crosshairs -->
  <circle cx="100" cy="100" r="44" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.22" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2, 4" opacity="0.16" />
  <line x1="100" y1="36" x2="100" y2="164" stroke="#ffffff" stroke-width="0.8" opacity="0.2" />
  <line x1="36" y1="100" x2="164" y2="100" stroke="#ffffff" stroke-width="0.8" opacity="0.2" />

  <!-- Small Target Dots -->
  <circle cx="56" cy="100" r="2" fill="#ffffff" opacity="0.35" />
  <circle cx="144" cy="100" r="2" fill="#ffffff" opacity="0.35" />
  <circle cx="100" cy="56" r="2" fill="#ffffff" opacity="0.35" />
  <circle cx="100" cy="144" r="2" fill="#ffffff" opacity="0.35" />

  <!-- Heart Pulse ECG Line -->
  <path d="M 52 100 L 74 100 L 92 52 L 114 148 L 132 90 L 148 100" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Medical Cross (+) in upper right of peak -->
  <path d="M 129 65 L 145 65 M 137 57 L 137 73" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round" />
</svg>
