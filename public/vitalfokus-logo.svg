<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vfGradientLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#008f7e" />
    </linearGradient>
  </defs>

  <!-- Left Squircle Icon (NO background box, NO drop-shadow artifact, pure transparent perimeter) -->
  <g transform="translate(16, 12)">
    <rect x="0" y="0" width="176" height="176" rx="46" ry="46" fill="url(#vfGradientLight)" />
    <!-- Blueprint circles & crosshair -->
    <circle cx="88" cy="88" r="42" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.22" />
    <circle cx="88" cy="88" r="58" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2, 4" opacity="0.16" />
    <line x1="88" y1="26" x2="88" y2="150" stroke="#ffffff" stroke-width="0.8" opacity="0.2" />
    <line x1="26" y1="88" x2="150" y2="88" stroke="#ffffff" stroke-width="0.8" opacity="0.2" />
    <!-- Pulse Line -->
    <path d="M 44 88 L 64 88 L 81 44 L 102 132 L 118 80 L 132 88" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Medical Cross (+) -->
    <path d="M 116 56 L 130 56 M 123 49 L 123 63" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" />
  </g>

  <!-- Right Typography (Proportionately scaled, bold and high-contrast) -->
  <g transform="translate(216, 0)">
    <!-- Line 1: Vital Fokus -->
    <text x="0" y="98" font-family="'Segoe UI', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="88" font-weight="800" letter-spacing="-0.02em">
      <tspan fill="#090d16">Vital </tspan><tspan fill="#0d9488">Fokus</tspan>
    </text>
    <!-- Line 2: Clinical Intelligence Suite (Enlarged and scaled proportionately) -->
    <text x="2" y="156" font-family="'Segoe UI', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="43" font-weight="700" fill="#334155" letter-spacing="-0.005em">
      Clinical Intelligence Suite
    </text>
  </g>
</svg>