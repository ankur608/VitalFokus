<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vfGradientLogoDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="vfGlowLogoDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Squircle Icon -->
  <g transform="translate(10, 10)">
    <rect x="6" y="6" width="168" height="168" rx="44" ry="44" fill="url(#vfGradientLogoDark)" filter="url(#vfGlowLogoDark)" />
    <!-- Blueprint circles & crosshair -->
    <circle cx="90" cy="90" r="42" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.25" />
    <circle cx="90" cy="90" r="58" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2, 4" opacity="0.18" />
    <line x1="90" y1="28" x2="90" y2="152" stroke="#ffffff" stroke-width="0.8" opacity="0.22" />
    <line x1="28" y1="90" x2="152" y2="90" stroke="#ffffff" stroke-width="0.8" opacity="0.22" />
    <!-- Pulse Line -->
    <path d="M 46 90 L 66 90 L 83 45 L 104 135 L 120 82 L 134 90" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Medical Cross (+) -->
    <path d="M 118 57 L 132 57 M 125 50 L 125 64" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(225, 0)">
    <!-- Line 1: VitalFokus -->
    <text x="0" y="104" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="800" letter-spacing="-0.025em">
      <tspan fill="#ffffff">Vital</tspan><tspan fill="#14b8a6">Fokus</tspan>
    </text>
    <!-- Line 2: Clinical Intelligence Suite -->
    <text x="2" y="146" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8" letter-spacing="0.04em">
      Clinical Intelligence Suite
    </text>
  </g>
</svg>
